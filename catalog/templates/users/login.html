<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Система управления парковкой</title>
</head>
<body>
    <h1>Авторизация</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div>
            <label for="id_username">Имя пользователя:</label>
            {{ form.username }}
        </div>
        
        <div>
            <label for="id_password">Пароль:</label>
            {{ form.password }}
        </div>
        
        <button type="submit">Войти в систему</button>
    </form>
    
    <div>
        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь здесь</a></p>
        <a href="{% url 'home' %}">Вернуться на главную страницу</a>
    </div>
</body>
</html>
